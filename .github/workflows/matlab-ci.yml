name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: MATLAB tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB and required toolboxes
        uses: matlab-actions/setup-matlab@v3
        with:
          products: >
            Control_System_Toolbox
            Robust_Control_Toolbox

      - name: Run unit tests with coverage
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: src
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: coverage/coverage.xml

      - name: Smoke-test source-derived plant construction
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath('src'));
            [G,meta]=buildHelicopterPlant;
            report=validatePlantModel(G,meta);
            assert(report.hasExpectedDimensions);
